# ============================================================================
# STATE PUBLIC TRANSPORT LOST & FOUND SYSTEM - H2 IN-MEMORY PROFILE (OFFLINE DEV)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================================

spring.datasource.url=jdbc:h2:mem:lost_found_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
