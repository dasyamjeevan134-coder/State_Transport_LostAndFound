# ============================================================================
# STATE PUBLIC TRANSPORT LOST & FOUND SYSTEM - APPLICATION CONFIGURATION
# ============================================================================

spring.application.name=lost-found-backend
server.port=8080

# ----------------------------------------------------------------------------
# MySQL 8 Database Configuration (Local MySQL or Aiven Console Cloud MySQL)
# For Aiven MySQL: Provide DB_URL directly (e.g. jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED)
# Or set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSL=true
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lost_found_db}?useSSL=${DB_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# Spring Data JPA / Hibernate
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# JWT Authentication Settings
# ----------------------------------------------------------------------------
# Secure 256-bit default secret key for development, override in production with JWT_SECRET env var
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours expiration (in milliseconds)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------------------------------------------
# Initial Administrator Account Configuration
# Allows safe automatic provisioning on first startup without hardcoding
# ----------------------------------------------------------------------------
app.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:true}
app.initial-admin.name=${ADMIN_NAME:System Administrator}
app.initial-admin.email=${ADMIN_EMAIL:admin@transport.gov}
app.initial-admin.password=${ADMIN_PASSWORD:Admin@12345}
app.initial-admin.phone=${ADMIN_PHONE:+19876543210}

# ----------------------------------------------------------------------------
# CORS Configuration (for future React frontend)
# ----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ----------------------------------------------------------------------------
# Swagger / OpenAPI Configuration
# ----------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ----------------------------------------------------------------------------
# File Upload Configuration
# ----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:./uploads}
