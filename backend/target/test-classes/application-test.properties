# Test configuration using in-memory H2 database
spring.application.name=lost-found-backend-test

spring.datasource.url=jdbc:h2:mem:lost_found_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

app.initial-admin.enabled=false
app.cors.allowed-origins=http://localhost:5173
app.upload.dir=./target/test-uploads
